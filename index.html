<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Pokemon</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --card: #ffffff;
        --text: #172033;
        --muted: #5f6b85;
        --accent: #e3350d;
        --accent-dark: #b52a0b;
        --border: #dbe1ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        background:
          radial-gradient(circle at top, #fff5d6 0%, transparent 35%),
          linear-gradient(180deg, #eef3ff 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        width: min(720px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 16px 50px rgba(23, 32, 51, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p {
        margin: 0 0 14px;
        line-height: 1.6;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      a {
        text-decoration: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 700;
      }

      .primary {
        background: var(--accent);
        color: #fff;
      }

      .primary:hover {
        background: var(--accent-dark);
      }

      .secondary {
        border: 1px solid var(--border);
        color: var(--text);
      }

      code {
        background: #f1f4fa;
        border-radius: 8px;
        padding: 2px 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>API Pokemon deployee</h1>
      <p>Le projet est bien en ligne. La racine <code>/</code> affiche cette page pour eviter la 404.</p>
      <p>L'endpoint API a tester est <code>/api</code>.</p>
      <div class="actions">
        <a class="primary" href="/api">Ouvrir l'API</a>
      </div>
    </main>
  </body>
</html>
